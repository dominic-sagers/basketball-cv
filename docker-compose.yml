services:
  server:
    build: .
    image: basketball-cv-server:latest
    container_name: basketball-cv-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./store:/app/store          # persists chunks, session state, and game output
      - ${HOME}/.ssh:/root/.ssh:ro  # SSH keys for DVC push to remote
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
